# Contoh virtual host Nginx untuk arthurg.my.id
# Salin ke /etc/nginx/sites-available/arthurg.my.id lalu:
#   ln -sf /etc/nginx/sites-available/arthurg.my.id /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# PENTING: proxy SEMUA path ke Node (jangan try_files ke 404.html custom
# sebelum sampai ke Express), supaya /public/tiktok & /admin/pastebin tidak 404.

server {
    listen 80;
    listen [::]:80;
    server_name arthurg.my.id www.arthurg.my.id arthur.my.id www.arthur.my.id;

    client_max_body_size 2048M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
