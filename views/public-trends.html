<html class="scroll-smooth" lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>X Trending · Public</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-robot.svg"/>
  <link rel="shortcut icon" href="/favicon-robot.svg"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      color: #dbeafe;
      background:
        radial-gradient(circle at 18% 14%, rgba(59, 130, 246, 0.18), transparent 42%),
        radial-gradient(circle at 82% 18%, rgba(34, 211, 238, 0.16), transparent 44%),
        linear-gradient(145deg, #020617 0%, #0b1f45 45%, #111c3f 100%);
    }
    h1, h2 { font-family: Outfit, "Plus Jakarta Sans", sans-serif; letter-spacing: -0.02em; }
    .glass {
      border-radius: 18px;
      border: 1px solid rgba(96, 165, 250, 0.28);
      background: rgba(15, 23, 42, 0.74);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 36px rgba(2, 6, 23, 0.44);
    }
    .btn {
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
      border: 1px solid rgba(125, 211, 252, 0.45);
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 45%, #0ea5e9 100%);
      color: #fff;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .field {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(96, 165, 250, 0.35);
      background: rgba(2, 6, 23, 0.7);
      color: #e2e8f0;
      padding: 12px 14px;
      outline: none;
    }
    .field:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35); }
    .status-strip {
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(2, 6, 23, 0.52);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      color: #e2e8f0;
    }
    .trend-item {
      border: 1px solid rgba(96, 165, 250, 0.18);
      background: rgba(2, 6, 23, 0.45);
      border-radius: 16px;
      padding: 14px 14px;
    }
    .rank-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:34px;
      height:34px;
      border-radius:999px;
      font-weight:900;
      border:1px solid rgba(148,163,184,0.25);
      background: rgba(15,23,42,0.55);
      color:#e2e8f0;
      flex: 0 0 auto;
    }
    .rank-1{ background: linear-gradient(135deg, rgba(245,158,11,0.45), rgba(234,179,8,0.18)); border-color: rgba(245,158,11,0.55); color: #fff7ed; }
    .rank-2{ background: linear-gradient(135deg, rgba(148,163,184,0.45), rgba(148,163,184,0.12)); border-color: rgba(148,163,184,0.55); color: #f8fafc; }
    .rank-3{ background: linear-gradient(135deg, rgba(217,119,6,0.45), rgba(217,119,6,0.12)); border-color: rgba(217,119,6,0.55); color: #fff7ed; }
    .hot {
      display:inline-flex;
      align-items:center;
      gap:6px;
      border-radius:999px;
      padding:6px 10px;
      font-weight:900;
      font-size: 0.78rem;
      border:1px solid rgba(239,68,68,0.45);
      background: rgba(239,68,68,0.12);
      color:#fecaca;
      margin-left: 10px;
      vertical-align: middle;
    }
    .trend-topic { font-weight: 800; color: #bfdbfe; }
    .trend-meta { font-size: 0.82rem; color: rgba(191, 219, 254, 0.75); margin-top: 6px; }
    .trend-actions a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      border-radius: 999px;
      padding: 8px 12px;
      border: 1px solid rgba(125, 211, 252, 0.32);
      background: rgba(15, 23, 42, 0.55);
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.85rem;
    }
  </style>
 </head>
 <body>
  <main class="max-w-6xl mx-auto px-4 py-8 md:py-12 space-y-6">
    <section class="glass p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-blue-100">X trending</h1>
          <p class="text-blue-200/90 mt-2 text-sm leading-relaxed">
            Ambil trending topic berdasarkan query (default: indonesia). Tiap topik ada tombol quick search di X/Google News.
          </p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <a class="btn" href="/public"><i class="fas fa-th-large"></i>Hub</a>
          <a class="btn" href="/"><i class="fas fa-home"></i>Beranda</a>
        </div>
      </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
      <article class="glass p-6 space-y-3">
        <h2 class="text-xl font-bold text-blue-200">Query</h2>
        <input id="trends-q" class="field" placeholder="indonesia" value="indonesia"/>
        <button id="trends-fetch" type="button" class="btn w-full"><i class="fas fa-bolt"></i>Ambil trending</button>
        <div id="trends-status" class="status-strip">Klik ambil untuk memuat trending.</div>
      </article>

      <article class="glass p-6 space-y-3">
        <h2 class="text-xl font-bold text-blue-200">Hasil</h2>
        <div id="trends-list" class="space-y-3"></div>
      </article>
    </section>
  </main>

  <script defer src="/public-trends.js"></script>
 </body>
</html>
