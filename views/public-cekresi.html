<html class="scroll-smooth" lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Cek Resi · Tracking J&amp;T &amp; SPX</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-robot.svg"/>
  <link rel="shortcut icon" href="/favicon-robot.svg"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    body {
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      color: #dbeafe;
      cursor: default;
      background:
        radial-gradient(ellipse at left center, rgba(30, 90, 200, 0.22), transparent 58%),
        radial-gradient(circle at 80% 16%, rgba(251, 146, 60, 0.14), transparent 42%),
        linear-gradient(145deg, #020617 0%, #0b1733 50%, #06152e 100%);
    }
    a, button { cursor: pointer; }
    h1, h2 { font-family: Outfit, "Plus Jakarta Sans", sans-serif; letter-spacing: -0.02em; }
    .glass {
      border-radius: 18px;
      border: 1px solid rgba(96, 165, 250, 0.3);
      background: rgba(15, 23, 42, 0.74);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 36px rgba(2, 6, 23, 0.44);
    }
    .btn {
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
      border: 1px solid rgba(125, 211, 252, 0.45);
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 45%, #0ea5e9 100%);
      color: #fff;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .field {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(96, 165, 250, 0.35);
      background: rgba(2, 6, 23, 0.7);
      color: #e2e8f0;
      padding: 12px 14px;
      outline: none;
    }
    .field:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35); }
    .status-strip {
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(2, 6, 23, 0.52);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      color: #e2e8f0;
    }
    label span { display: block; margin-bottom: 6px; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: #7dd3fc; }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .meta-grid { grid-template-columns: 1fr 1fr; }
    }
    .meta-card {
      border-radius: 14px;
      border: 1px solid rgba(96, 165, 250, 0.22);
      background: rgba(2, 6, 23, 0.48);
      padding: 12px 14px;
    }
    .meta-card dt { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: #93c5fd; }
    .meta-card dd { margin: 4px 0 0; font-weight: 700; color: #e2e8f0; }
    .timeline { position: relative; padding-left: 1.15rem; }
    .timeline::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.7), rgba(30, 64, 175, 0.15));
    }
    .timeline-item {
      position: relative;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(96, 165, 250, 0.2);
      background: rgba(2, 6, 23, 0.5);
    }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: calc(-1.15rem + 1px);
      top: 18px;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }
    .timeline-item:first-child::before { background: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.8); }
    .t-time { font-size: 0.78rem; color: #93c5fd; font-weight: 700; }
    .t-desc { margin-top: 4px; color: #e2e8f0; font-weight: 600; }
    .t-loc { margin-top: 4px; font-size: 0.82rem; color: rgba(191, 219, 254, 0.75); }
  </style>
 </head>
 <body>
  <main class="max-w-5xl mx-auto px-4 py-8 md:py-12 space-y-6">
    <section class="glass p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-blue-100">Cek Resi</h1>
          <p class="text-blue-200/90 mt-2 text-sm leading-relaxed">
            Tracking paket realtime untuk J&amp;T dan SPX. Masukkan nomor resi, pilih kurir, lihat timeline status.
          </p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <a class="btn" href="/public"><i class="fas fa-th-large"></i>Hub</a>
          <a class="btn" href="/"><i class="fas fa-home"></i>Beranda</a>
        </div>
      </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
      <article class="glass p-6 space-y-3">
        <h2 class="text-xl font-bold text-blue-200">Lacak paket</h2>
        <label>
          <span>Nomor resi</span>
          <input id="resi-number" class="field" type="text" placeholder="Contoh: JP1234567890" autocomplete="off"/>
        </label>
        <label>
          <span>Kurir / ekspedisi</span>
          <select id="resi-courier" class="field">
            <option value="jnt">J&amp;T Express (jnt)</option>
            <option value="spx">Shopee Express (spx)</option>
          </select>
        </label>
        <button id="resi-check" type="button" class="btn w-full"><i class="fas fa-search-location"></i>Cek Resi</button>
        <div id="resi-status" class="status-strip">Masukkan resi, pilih kurir, lalu cek.</div>
      </article>

      <article class="glass p-6 space-y-4">
        <h2 class="text-xl font-bold text-blue-200">Status &amp; Timeline</h2>
        <div id="resi-meta" class="meta-grid"></div>
        <div id="resi-timeline" class="timeline"></div>
      </article>
    </section>
  </main>

  <script defer src="/public-cekresi.js"></script>
 </body>
</html>
