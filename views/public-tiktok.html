<html class="scroll-smooth" lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <meta name="creator" content="Gerald Arthur Gunawan">
  <meta name="publisher" content="Gerald Arthur Gunawan">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Gerald Arthur Gunawan",

  <title>TikTok Downloader · Video & MP3</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-robot.svg"/>
  <link rel="shortcut icon" href="/favicon-robot.svg"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      color: #dbeafe;
      background:
        radial-gradient(circle at 15% 10%, rgba(236, 72, 153, 0.16), transparent 40%),
        radial-gradient(circle at 80% 18%, rgba(56, 189, 248, 0.16), transparent 44%),
        linear-gradient(145deg, #020617 0%, #0b1733 55%, #06152e 100%);
    }
    h1, h2 { font-family: Outfit, "Plus Jakarta Sans", sans-serif; letter-spacing: -0.02em; }
    .glass {
      border-radius: 18px;
      border: 1px solid rgba(96, 165, 250, 0.28);
      background: rgba(15, 23, 42, 0.74);
      backdrop-filter: blur(4px);
      transform: translateZ(0);
      box-shadow: 0 18px 36px rgba(2, 6, 23, 0.44);
    }
    .btn {
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
      border: 1px solid rgba(125, 211, 252, 0.45);
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 45%, #0ea5e9 100%);
      color: #fff;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .field {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(96, 165, 250, 0.35);
      background: rgba(2, 6, 23, 0.7);
      color: #e2e8f0;
      padding: 14px 16px;
      font-size: 1.02rem;
      min-height: 52px;
      outline: none;
    }
    .field:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35); }
    .status-strip {
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(2, 6, 23, 0.52);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      color: #e2e8f0;
    }
    .thumb {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(96, 165, 250, 0.28);
      background: rgba(2, 6, 23, 0.75);
    }
    video {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(96, 165, 250, 0.28);
      background: rgba(2, 6, 23, 0.75);
    }
    .btn-dl {
      margin-top: 10px;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      border: 1px solid rgba(125, 211, 252, 0.45);
      background: rgba(15, 23, 42, 0.65);
      color: #e2e8f0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-dl.hidden { display: none; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  </style>
 </head>
 <body>
  <main class="max-w-6xl mx-auto px-4 py-8 md:py-12 space-y-6">
    <section class="glass p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-blue-100">TikTok downloader</h1>
          <p class="text-blue-200/90 mt-2 text-sm leading-relaxed">
            Tempel link post TikTok, lalu unduh Video (MP4) atau Audio (MP3) tanpa klik kanan.
          </p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <a class="btn" href="/public"><i class="fas fa-th-large"></i>Hub</a>
          <a class="btn" href="/"><i class="fas fa-home"></i>Beranda</a>
        </div>
      </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
      <article class="glass p-6 space-y-4">
        <h2 class="text-xl font-bold text-blue-200">Input</h2>
        <div class="space-y-2">
          <label class="text-blue-200 text-sm font-semibold" for="tt-url">Link TikTok</label>
          <input id="tt-url" class="field" placeholder="https://www.tiktok.com/@user/video/..." />
        </div>
        <button id="tt-fetch" type="button" class="btn w-full"><i class="fas fa-cloud-download-alt"></i>Ambil media</button>
        <div id="tt-status" class="status-strip">Masukkan link TikTok lalu proses.</div>
      </article>

      <article class="glass p-6 space-y-4">
        <h2 class="text-xl font-bold text-blue-200">Hasil</h2>
        <img id="tt-thumb" class="thumb hidden" alt="Thumbnail TikTok"/>
        <div id="tt-meta" class="status-strip hidden"></div>
        <video id="tt-preview" class="hidden" controls playsinline></video>
        <div class="actions">
          <a id="tt-dl-video" class="btn-dl hidden" href="#" download rel="noopener"><i class="fas fa-video"></i>Download Video</a>
          <a id="tt-dl-audio" class="btn-dl hidden" href="#" download rel="noopener"><i class="fas fa-music"></i>Download MP3</a>
        </div>
      </article>
    </section>
  </main>

  <script defer src="/public-tiktok.js"></script>
 </body>
</html>
