<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Vault / Pastebin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-robot.svg"/>
  <link rel="shortcut icon" href="/favicon-robot.svg"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      color: #dbeafe;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 14%, rgba(56, 189, 248, 0.18), transparent 33%),
        radial-gradient(circle at 82% 12%, rgba(59, 130, 246, 0.16), transparent 36%),
        linear-gradient(145deg, #030712 0%, #0b1733 46%, #06152e 100%);
    }
    .glass {
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.82), rgba(10, 16, 33, 0.78));
      border: 1px solid rgba(148, 163, 184, 0.24);
      box-shadow: 0 18px 45px rgba(2, 6, 23, 0.45);
      backdrop-filter: blur(4px);
      transform: translateZ(0);
    }
    .neon-btn {
      border: 1px solid rgba(147, 197, 253, 0.35);
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 52%, #1e3a8a 100%);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.33);
    }
    textarea, input {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(59, 130, 246, 0.4);
      background: rgba(2, 6, 23, 0.72);
      color: #e2e8f0;
      padding: 12px 14px;
      outline: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9rem;
    }
    textarea { min-height: 220px; resize: vertical; }
    .snippet-card {
      border: 1px solid rgba(96, 165, 250, 0.22);
      background: rgba(2, 6, 23, 0.5);
      border-radius: 14px;
      padding: 14px;
    }
    .snippet-body {
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 180px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-top: 8px;
    }
  </style>
</head>
<body class="px-4 py-8 md:px-8 md:py-10">
  <main class="mx-auto max-w-6xl space-y-6">
    <header class="glass rounded-2xl p-6 md:p-8">
      <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div>
          <p class="text-sm uppercase tracking-[0.25em] text-blue-300">/admin/pastebin</p>
          <h1 class="mt-2 text-3xl font-bold text-blue-100 md:text-4xl">Text Vault / Pastebin</h1>
          <p class="mt-3 max-w-3xl text-sm text-blue-200 md:text-base">
            Simpan snippet kode/teks mentah, salin cepat ke clipboard, lihat ulang, atau hapus kapan saja.
          </p>
        </div>
        <div class="flex flex-wrap gap-2">
          <a href="/admin" class="rounded-lg border border-blue-300/50 px-4 py-2 text-sm font-semibold text-blue-100 hover:bg-blue-500/20">Admin Home</a>
          <a href="/admin/file-vault" class="rounded-lg border border-blue-300/50 px-4 py-2 text-sm font-semibold text-blue-100 hover:bg-blue-500/20">File Vault</a>
          <a href="/admin/logout" class="rounded-lg border border-rose-300/60 px-4 py-2 text-sm font-semibold text-rose-100 hover:bg-rose-500/20">Logout</a>
        </div>
      </div>
    </header>

    <section class="grid gap-6 lg:grid-cols-[1.1fr_0.9fr]">
      <div class="glass rounded-2xl p-6 space-y-4">
        <h2 class="text-xl font-semibold text-blue-100">Snippet baru</h2>
        <div>
          <label class="mb-2 block text-sm font-semibold text-blue-200" for="paste-title">Judul (opsional)</label>
          <input id="paste-title" placeholder="contoh: nginx config / snippet API" />
        </div>
        <div>
          <label class="mb-2 block text-sm font-semibold text-blue-200" for="paste-content">Isi teks / kode</label>
          <textarea id="paste-content" placeholder="Tempel teks atau kode di sini..."></textarea>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="paste-save" type="button" class="neon-btn rounded-lg px-4 py-2.5 text-sm font-semibold text-white">Save Snippet</button>
          <button id="paste-copy-draft" type="button" class="rounded-lg border border-violet-400/40 px-4 py-2.5 text-sm font-semibold text-violet-100 hover:bg-violet-500/20">Copy to Clipboard</button>
          <button id="paste-clear" type="button" class="rounded-lg border border-slate-400/40 px-4 py-2.5 text-sm font-semibold text-slate-100 hover:bg-slate-500/20">Clear</button>
        </div>
        <div id="feedback" class="hidden rounded-lg border px-4 py-3 text-sm"></div>
      </div>

      <aside class="glass rounded-2xl p-6">
        <div class="flex items-center justify-between gap-3">
          <h2 class="text-xl font-semibold text-blue-100">Tersimpan</h2>
          <button id="paste-refresh" type="button" class="rounded-lg border border-cyan-400/40 px-3 py-1.5 text-xs font-semibold text-cyan-100 hover:bg-cyan-500/20">Refresh</button>
        </div>
        <div id="paste-list" class="mt-4 space-y-3"></div>
        <p id="paste-empty" class="mt-4 hidden text-sm text-blue-200">Belum ada snippet.</p>
      </aside>
    </section>
  </main>

  <script>
    const titleInput = document.getElementById('paste-title');
    const contentInput = document.getElementById('paste-content');
    const listRoot = document.getElementById('paste-list');
    const emptyState = document.getElementById('paste-empty');
    const feedback = document.getElementById('feedback');

    function showFeedback(type, message) {
      feedback.classList.remove('hidden');
      feedback.textContent = message;
      feedback.className = type === 'success'
        ? 'rounded-lg border border-emerald-400/40 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-200'
        : 'rounded-lg border border-rose-400/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-200';
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (_e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      }
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderList(items) {
      listRoot.innerHTML = '';
      if (!items.length) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');
      items.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'snippet-card';
        const created = item.createdAt ? new Date(item.createdAt).toLocaleString('id-ID') : '-';
        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="font-semibold text-blue-100">${escapeHtml(item.title || 'Untitled')}</p>
              <p class="text-xs text-blue-300 mt-1">${created} · ${Number(item.size || 0)} chars</p>
            </div>
          </div>
          <div class="snippet-body">${escapeHtml(item.content || '')}</div>
          <div class="mt-3 flex flex-wrap gap-2">
            <button data-action="copy" data-id="${item.id}" class="rounded-md border border-violet-400/40 px-2 py-1 text-xs font-semibold text-violet-200 hover:bg-violet-500/20">Copy to Clipboard</button>
            <button data-action="load" data-id="${item.id}" class="rounded-md border border-cyan-400/40 px-2 py-1 text-xs font-semibold text-cyan-200 hover:bg-cyan-500/20">View / Edit</button>
            <button data-action="delete" data-id="${item.id}" class="rounded-md border border-rose-400/40 px-2 py-1 text-xs font-semibold text-rose-200 hover:bg-rose-500/20">Delete</button>
          </div>
        `;
        listRoot.appendChild(card);
      });
    }

    async function loadSnippets() {
      const res = await fetch('/api/pastebin');
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Gagal memuat snippet.');
      renderList(Array.isArray(data.items) ? data.items : []);
    }

    document.getElementById('paste-save').addEventListener('click', async () => {
      const title = String(titleInput.value || '').trim();
      const content = String(contentInput.value || '');
      if (!content.trim()) {
        showFeedback('error', 'Isi teks tidak boleh kosong.');
        return;
      }
      try {
        const res = await fetch('/api/pastebin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Gagal menyimpan.');
        showFeedback('success', 'Snippet tersimpan.');
        titleInput.value = '';
        contentInput.value = '';
        await loadSnippets();
      } catch (e) {
        showFeedback('error', e.message);
      }
    });

    document.getElementById('paste-copy-draft').addEventListener('click', async () => {
      const ok = await copyText(String(contentInput.value || ''));
      showFeedback(ok ? 'success' : 'error', ok ? 'Draft disalin ke clipboard.' : 'Gagal menyalin.');
    });

    document.getElementById('paste-clear').addEventListener('click', () => {
      titleInput.value = '';
      contentInput.value = '';
      feedback.classList.add('hidden');
    });

    document.getElementById('paste-refresh').addEventListener('click', () => {
      loadSnippets().catch((e) => showFeedback('error', e.message));
    });

    listRoot.addEventListener('click', async (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      const action = target.getAttribute('data-action');
      const id = target.getAttribute('data-id');
      if (!action || !id) return;

      try {
        if (action === 'copy' || action === 'load') {
          const res = await fetch(`/api/pastebin/${encodeURIComponent(id)}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Snippet tidak ditemukan.');
          if (action === 'copy') {
            const ok = await copyText(String(data.item?.content || ''));
            showFeedback(ok ? 'success' : 'error', ok ? 'Snippet disalin.' : 'Gagal menyalin.');
          } else {
            titleInput.value = data.item?.title || '';
            contentInput.value = data.item?.content || '';
            showFeedback('success', 'Snippet dimuat ke editor.');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
          return;
        }

        if (action === 'delete') {
          if (!confirm('Hapus snippet ini?')) return;
          const res = await fetch(`/api/pastebin/${encodeURIComponent(id)}`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Gagal menghapus.');
          showFeedback('success', 'Snippet dihapus.');
          await loadSnippets();
        }
      } catch (e) {
        showFeedback('error', e.message);
      }
    });

    loadSnippets().catch((e) => showFeedback('error', e.message));
  </script>
</body>
</html>
