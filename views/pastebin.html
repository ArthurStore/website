<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Gerald Arthur Gunawan">
  <meta name="creator" content="Gerald Arthur Gunawan">
  <meta name="publisher" content="Gerald Arthur Gunawan">
  <meta name="keywords" content="Gerald Arthur Gunawan, Arthur G, sewa bot, bot whatsapp, developer surabaya">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Gerald Arthur Gunawan",
    "alternateName": "Arthur G",
    "url": "https://arthurg.my.id",
    "jobTitle": "Network Engineer & Bot Developer",
    "sameAs": [
      "https://github.com/ArthurStore"
    ]
  }
  </script>
  <title>Pastebin · Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-robot.svg"/>
  <link rel="shortcut icon" href="/favicon-robot.svg"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      color: #dbeafe;
      min-height: 100vh;
      position: relative;
      background:
        radial-gradient(circle at 12% 14%, rgba(56, 189, 248, 0.22), transparent 33%),
        radial-gradient(circle at 82% 12%, rgba(59, 130, 246, 0.2), transparent 36%),
        linear-gradient(145deg, #030712 0%, #0b1733 46%, #06152e 100%);
      background-size: 130% 130%, 130% 130%, 220% 220%;
      animation: vaultGradientShift 20s ease-in-out infinite;
      overflow-x: hidden;
    }
    h1, h2 {
      font-family: "Outfit", "Plus Jakarta Sans", sans-serif;
      letter-spacing: -0.02em;
    }
    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      border-radius: 0.65rem;
      border: 1px solid rgba(96, 165, 250, 0.32);
      background: rgba(15, 23, 42, 0.65);
      padding: 0.48rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: #dbeafe;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .nav-pill:hover {
      border-color: rgba(147, 197, 253, 0.7);
      background: rgba(37, 99, 235, 0.22);
      transform: translateY(-1px);
    }
    .nav-pill.active {
      border-color: rgba(96, 165, 250, 0.85);
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.45), rgba(14, 165, 233, 0.3));
      color: #fff;
    }
    .nav-pill.danger {
      border-color: rgba(248, 113, 113, 0.45);
      color: #fecaca;
    }
    .nav-pill.danger:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(248, 113, 113, 0.75);
    }
    body::before {
      content: "";
      position: fixed;
      inset: -15%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.22), transparent 45%),
        radial-gradient(circle at 72% 72%, rgba(14, 165, 233, 0.14), transparent 42%);
      filter: blur(16px);
      transform: translateZ(0);
      will-change: transform;
      contain: strict;
      animation: vaultGlowMove 18s ease-in-out infinite;
    }
    .glass {
      position: relative;
      z-index: 1;
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.8), rgba(10, 16, 33, 0.76));
      border: 1px solid rgba(148, 163, 184, 0.24);
      box-shadow: 0 18px 45px rgba(2, 6, 23, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transform: translateZ(0);
    }
    .neon-btn {
      border: 1px solid rgba(147, 197, 253, 0.35);
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 52%, #1e3a8a 100%);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.33);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .neon-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.45);
    }
    .link-btn {
      transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    }
    .link-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(147, 197, 253, 0.58);
    }
    textarea, input {
      width: 100%;
      box-sizing: border-box !important;
      border-radius: 12px;
      border: 1px solid rgba(59, 130, 246, 0.45);
      background: rgba(2, 6, 23, 0.78);
      color: #e2e8f0;
      padding: 14px 18px !important;
      line-height: 1.65 !important;
      outline: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    textarea:focus, input:focus {
      border-color: rgba(96, 165, 250, 0.85);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    textarea {
      min-height: 260px;
      padding: 16px 20px !important;
      line-height: 1.7 !important;
      resize: vertical;
    }
    .snippet-card {
      border: 1px solid rgba(96, 165, 250, 0.22);
      background: rgba(2, 6, 23, 0.5);
      border-radius: 14px;
      padding: 16px;
    }
    .snippet-body {
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 160px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.84rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(59, 130, 246, 0.18);
    }
    @keyframes vaultGradientShift {
      0% { background-position: 0% 0%, 100% 0%, 0% 50%; }
      50% { background-position: 8% 12%, 88% 14%, 100% 50%; }
      100% { background-position: 0% 0%, 100% 0%, 0% 50%; }
    }
    @keyframes vaultGlowMove {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(2%, -2%, 0) scale(1.04); }
    }
    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
      body::before { animation: none; }
    }
  </style>
</head>
<body class="px-4 py-8 md:px-8 md:py-10">
  <main class="mx-auto max-w-7xl space-y-6">
    <header class="glass rounded-2xl p-6 md:p-8">
      <div class="flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.22em] text-sky-400">/admin/pastebin</p>
          <h1 class="mt-2 text-3xl font-bold text-white md:text-4xl">Pastebin</h1>
          <p class="mt-2 max-w-2xl text-sm text-blue-200/90 md:text-base">
            Simpan catatan atau potongan kode dan bagikan lewat link publik <code>/p/slug</code>.
          </p>
        </div>
        <nav class="flex flex-wrap gap-2" aria-label="Admin Navigation">
          <a href="/" class="nav-pill">Home</a>
          <a href="/admin" class="nav-pill">Dashboard</a>
          <a href="/admin/file-vault" class="nav-pill">File Vault</a>
          <a href="/admin/pastebin" class="nav-pill active">Pastebin</a>
          <a href="/admin/short-link" class="nav-pill">Short Link</a>
          <a href="/admin/ip-calculator" class="nav-pill">IP Calculator</a>
          <a href="/admin/pdf-to-jpg" class="nav-pill">PDF to JPG</a>
          <a href="/admin/logout" class="nav-pill danger">Logout</a>
        </nav>
      </div>
    </header>

    <section class="grid gap-6 lg:grid-cols-[1.15fr_0.85fr]">
      <div class="glass rounded-2xl p-6 md:p-7 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h2 id="editor-heading" class="text-xl font-semibold text-blue-100">Snippet Baru</h2>
          <span id="edit-badge" class="hidden rounded-full border border-amber-400/40 bg-amber-500/15 px-3 py-1 text-xs font-semibold text-amber-200">Mode Edit</span>
        </div>
        <div>
          <label class="mb-2 block text-sm font-semibold text-blue-200" for="paste-title">Judul / Slug (opsional)</label>
          <input id="paste-title" class="px-4 py-3.5 leading-relaxed" placeholder="contoh: nginx-prod (kosong = otomatis)" />
          <p class="mt-1.5 text-xs text-blue-300/80">Otomatis digunakan sebagai judul sekaligus link publik <code>/p/slug</code>.</p>
        </div>
        <div>
          <label class="mb-2 block text-sm font-semibold text-blue-200" for="paste-content">Isi teks / kode</label>
          <textarea id="paste-content" class="p-5 leading-relaxed" placeholder="Tempel teks atau kode di sini..."></textarea>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="paste-save" type="button" class="neon-btn rounded-lg px-5 py-2.5 text-sm font-semibold text-white">Save Snippet</button>
          <button id="paste-copy-draft" type="button" class="link-btn rounded-lg border border-violet-400/40 px-4 py-2.5 text-sm font-semibold text-violet-100 hover:bg-violet-500/20">Copy to Clipboard</button>
          <button id="paste-clear" type="button" class="link-btn rounded-lg border border-slate-400/40 px-4 py-2.5 text-sm font-semibold text-slate-100 hover:bg-slate-500/20">Clear / Reset</button>
        </div>
        <div id="feedback" class="hidden rounded-lg border px-4 py-3 text-sm"></div>
      </div>

      <aside class="glass rounded-2xl p-6">
        <div class="flex items-center justify-between gap-3">
          <h2 class="text-xl font-semibold text-blue-100">Tersimpan</h2>
          <button id="paste-refresh" type="button" class="link-btn rounded-lg border border-cyan-400/40 px-3 py-1.5 text-xs font-semibold text-cyan-100 hover:bg-cyan-500/20">Refresh</button>
        </div>
        <div id="paste-list" class="mt-4 space-y-3"></div>
        <p id="paste-empty" class="mt-4 hidden text-sm text-blue-200">Belum ada snippet.</p>
      </aside>
    </section>
  </main>

  <script>
    (function syncAdminSession() {
      try {
        const match = document.cookie.match(/(?:^|;\s*)arthur_admin_token=([^;]+)/);
        if (match && match[1]) {
          localStorage.setItem('arthur_admin_session', decodeURIComponent(match[1]));
        } else {
          const saved = localStorage.getItem('arthur_admin_session');
          if (saved) {
            document.cookie = 'arthur_admin_token=' + encodeURIComponent(saved) + '; Path=/; Max-Age=31536000; SameSite=Lax';
          }
        }
      } catch (_e) {}
    })();

    const titleInput = document.getElementById('paste-title');
    const contentInput = document.getElementById('paste-content');
    const listRoot = document.getElementById('paste-list');
    const emptyState = document.getElementById('paste-empty');
    const feedback = document.getElementById('feedback');
    const editorHeading = document.getElementById('editor-heading');
    const editBadge = document.getElementById('edit-badge');
    const saveBtn = document.getElementById('paste-save');

    let editingId = null;

    function setEditMode(item = null) {
      if (item && item.id) {
        editingId = item.id;
        editorHeading.textContent = 'Edit Snippet';
        editBadge.textContent = `Mengedit: /p/${item.slug || item.id}`;
        editBadge.classList.remove('hidden');
        saveBtn.textContent = 'Update Snippet';
      } else {
        editingId = null;
        editorHeading.textContent = 'Snippet Baru';
        editBadge.textContent = 'Mode Edit';
        editBadge.classList.add('hidden');
        saveBtn.textContent = 'Save Snippet';
      }
    }

    function showFeedback(type, message) {
      feedback.classList.remove('hidden');
      feedback.textContent = message;
      feedback.className = type === 'success'
        ? 'rounded-lg border border-emerald-400/40 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-200'
        : 'rounded-lg border border-rose-400/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-200';
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (_e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      }
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function publicUrl(slug) {
      return `${window.location.origin}/p/${encodeURIComponent(slug)}`;
    }

    function renderList(items) {
      listRoot.innerHTML = '';
      if (!items.length) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');
      items.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'snippet-card';
        const created = item.createdAt ? new Date(item.createdAt).toLocaleString('id-ID') : '-';
        const slug = item.slug || item.id;
        const displayTitle = item.title || slug || 'Untitled';
        const share = publicUrl(slug);
        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="font-semibold text-blue-100">${escapeHtml(displayTitle)}</p>
              <p class="text-xs text-blue-300 mt-1">${created} · ${Number(item.size || 0)} chars · ${Number(item.clickCount || 0)} klik</p>
              <a href="${escapeHtml(share)}" target="_blank" rel="noopener" class="mt-1 inline-block break-all text-xs font-semibold text-cyan-200 hover:underline">${escapeHtml(share)}</a>
            </div>
          </div>
          <div class="snippet-body">${escapeHtml(item.content || '')}</div>
          <div class="mt-3 flex flex-wrap gap-2">
            <button data-action="copy-link" data-url="${escapeHtml(share)}" class="rounded-md border border-emerald-400/40 px-2 py-1 text-xs font-semibold text-emerald-200 hover:bg-emerald-500/20">Copy Link</button>
            <button data-action="copy" data-id="${item.id}" class="rounded-md border border-violet-400/40 px-2 py-1 text-xs font-semibold text-violet-200 hover:bg-violet-500/20">Copy Text</button>
            <button data-action="load" data-id="${item.id}" class="rounded-md border border-cyan-400/40 px-2 py-1 text-xs font-semibold text-cyan-200 hover:bg-cyan-500/20">View / Edit</button>
            <button data-action="delete" data-id="${item.id}" class="rounded-md border border-rose-400/40 px-2 py-1 text-xs font-semibold text-rose-200 hover:bg-rose-500/20">Delete</button>
          </div>
        `;
        listRoot.appendChild(card);
      });
    }

    async function loadSnippets() {
      const res = await fetch('/api/pastebin');
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Gagal memuat snippet.');
      renderList(Array.isArray(data.items) ? data.items : []);
    }

    document.getElementById('paste-save').addEventListener('click', async () => {
      const unifiedName = String(titleInput.value || '').trim();
      const content = String(contentInput.value || '');
      if (!content.trim()) {
        showFeedback('error', 'Isi teks tidak boleh kosong.');
        return;
      }
      try {
        const isEditing = Boolean(editingId);
        const endpoint = isEditing
          ? `/api/pastebin/${encodeURIComponent(editingId)}`
          : '/api/pastebin';
        const method = isEditing ? 'PUT' : 'POST';
        const res = await fetch(endpoint, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: editingId || undefined,
            title: unifiedName,
            slug: unifiedName,
            content
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Gagal menyimpan.');
        const share = data.item?.publicUrl || publicUrl(data.item?.slug || data.item?.id);
        showFeedback('success', `${isEditing ? 'Snippet diperbarui' : 'Snippet tersimpan'}. Short link: ${share}`);
        titleInput.value = '';
        contentInput.value = '';
        setEditMode(null);
        await loadSnippets();
      } catch (e) {
        showFeedback('error', e.message);
      }
    });

    document.getElementById('paste-copy-draft').addEventListener('click', async () => {
      const ok = await copyText(String(contentInput.value || ''));
      showFeedback(ok ? 'success' : 'error', ok ? 'Draft disalin ke clipboard.' : 'Gagal menyalin.');
    });

    document.getElementById('paste-clear').addEventListener('click', () => {
      titleInput.value = '';
      contentInput.value = '';
      setEditMode(null);
      feedback.classList.add('hidden');
    });

    document.getElementById('paste-refresh').addEventListener('click', () => {
      loadSnippets().catch((e) => showFeedback('error', e.message));
    });

    listRoot.addEventListener('click', async (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      const action = target.getAttribute('data-action');
      if (!action) return;

      try {
        if (action === 'copy-link') {
          const url = target.getAttribute('data-url') || '';
          const ok = await copyText(url);
          showFeedback(ok ? 'success' : 'error', ok ? 'Short link disalin.' : 'Gagal menyalin link.');
          return;
        }

        const id = target.getAttribute('data-id');
        if (!id) return;

        if (action === 'copy' || action === 'load') {
          const res = await fetch(`/api/pastebin/${encodeURIComponent(id)}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Snippet tidak ditemukan.');
          if (action === 'copy') {
            const ok = await copyText(String(data.item?.content || ''));
            showFeedback(ok ? 'success' : 'error', ok ? 'Snippet disalin.' : 'Gagal menyalin.');
          } else {
            titleInput.value = data.item?.slug || data.item?.title || '';
            contentInput.value = data.item?.content || '';
            setEditMode(data.item);
            showFeedback('success', `Mode edit aktif untuk "/p/${data.item?.slug || data.item?.id}". Silakan ubah lalu klik Update Snippet.`);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
          return;
        }

        if (action === 'delete') {
          if (!confirm('Hapus snippet ini?')) return;
          const res = await fetch(`/api/pastebin/${encodeURIComponent(id)}`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Gagal menghapus.');
          if (editingId === id) {
            titleInput.value = '';
            contentInput.value = '';
            setEditMode(null);
          }
          showFeedback('success', 'Snippet dihapus.');
          await loadSnippets();
        }
      } catch (e) {
        showFeedback('error', e.message);
      }
    });

    loadSnippets().catch((e) => showFeedback('error', e.message));
  </script>
</body>
</html>
