<html class="scroll-smooth" lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Public Cuaca Visual</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-robot.svg"/>
  <link rel="shortcut icon" href="/favicon-robot.svg"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      color: #dbeafe;
      background:
        radial-gradient(circle at 10% 15%, rgba(56, 189, 248, 0.28), transparent 36%),
        radial-gradient(circle at 88% 14%, rgba(99, 102, 241, 0.3), transparent 37%),
        linear-gradient(145deg, #020617 0%, #0b1d3d 46%, #091b37 100%);
    }
    .glass {
      background: rgba(10, 20, 43, 0.75);
      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: 16px;
      box-shadow: 0 18px 36px rgba(2, 6, 23, 0.42);
      backdrop-filter: blur(10px);
    }
    .field {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(125, 211, 252, 0.35);
      background: rgba(8, 20, 43, 0.9);
      color: #e2e8f0;
      padding: 10px 12px;
    }
    .field:focus {
      outline: 2px solid rgba(147, 197, 253, 0.65);
      outline-offset: 1px;
    }
    .btn {
      border-radius: 10px;
      border: 1px solid rgba(147, 197, 253, 0.34);
      background: linear-gradient(130deg, #2563eb 0%, #1d4ed8 45%, #0ea5e9 100%);
      color: #fff;
      font-weight: 700;
      padding: 10px 14px;
      transition: transform .2s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .result-box {
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.62);
      padding: 14px;
      min-height: 220px;
    }
    .weather-hero {
      border-radius: 16px;
      padding: 16px;
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 12px;
      align-items: center;
    }
    .weather-sunny {
      position: relative;
      overflow: hidden;
      background: linear-gradient(130deg, rgba(251, 191, 36, 0.37), rgba(14, 165, 233, 0.16));
    }
    .weather-sunny::after {
      content: "";
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 999px;
      right: -20px;
      bottom: -30px;
      background: radial-gradient(circle, rgba(253, 224, 71, 0.95), rgba(245, 158, 11, 0.35) 58%, rgba(245, 158, 11, 0) 72%);
      animation: sunRiseGlow 3.8s ease-in-out infinite alternate;
      box-shadow: 0 0 24px rgba(251, 191, 36, 0.35);
      pointer-events: none;
    }
    .weather-cloudy { background: linear-gradient(130deg, rgba(148, 163, 184, 0.35), rgba(30, 64, 175, 0.2)); }
    .weather-rainy { background: linear-gradient(130deg, rgba(14, 165, 233, 0.3), rgba(30, 41, 59, 0.38)); }
    .weather-storm { background: linear-gradient(130deg, rgba(99, 102, 241, 0.34), rgba(17, 24, 39, 0.52)); }
    .weather-icon {
      width: 72px;
      height: 72px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 2rem;
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 20px rgba(147, 197, 253, 0.35);
    }
    .forecast-grid {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }
    .forecast-item {
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.66);
      padding: 10px;
      font-size: 0.86rem;
    }
    @keyframes sunRiseGlow {
      0% {
        transform: translateY(12px) scale(0.92);
        opacity: 0.82;
      }
      100% {
        transform: translateY(-8px) scale(1.08);
        opacity: 1;
      }
    }
  </style>
 </head>
 <body>
  <main class="max-w-6xl mx-auto px-4 py-8 md:py-12 space-y-6">
   <section class="glass p-6">
    <div class="flex flex-col lg:flex-row gap-5 items-start lg:items-center lg:justify-between">
     <div>
      <h1 class="text-3xl md:text-4xl font-extrabold text-blue-200">☀️ Cek Cuaca</h1>
      <p class="text-blue-100 mt-2 max-w-2xl">Masukkan nama wilayah untuk melihat cuaca saat ini dan prakiraan jam berikutnya.</p>
     </div>
     <div class="flex flex-wrap gap-2">
      <a href="/public" class="btn inline-flex items-center gap-2"><i class="fas fa-th-large"></i><span>Hub Public</span></a>
      <a href="/" class="btn inline-flex items-center gap-2"><i class="fas fa-home"></i><span>Beranda</span></a>
     </div>
    </div>
   </section>

   <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <article class="glass p-5 lg:col-span-1">
     <h2 class="text-xl font-bold text-blue-300 mb-3"><i class="fas fa-map-marker-alt mr-2"></i>Cari Lokasi</h2>
     <form id="weather-form" class="space-y-3">
      <input class="field" id="subdistrict" name="subdistrict" placeholder="Contoh: batang" value="batang"/>
      <button class="btn w-full" type="submit">Lihat Cuaca</button>
     </form>
     <div class="mt-4 text-sm text-blue-200">
      <p>🌤️ Cerah → icon matahari</p>
      <p>☁️ Berawan → icon awan</p>
      <p>🌧️ Hujan → icon hujan</p>
      <p>⛈️ Badai → icon petir</p>
     </div>
    </article>
    <article class="glass p-5 lg:col-span-2">
     <h2 class="text-xl font-bold text-blue-300 mb-3"><i class="fas fa-cloud-sun mr-2"></i>Panel Cuaca</h2>
     <div id="weather-result" class="result-box text-blue-100">Tekan "Lihat Cuaca" untuk memuat data wilayah kamu.</div>
    </article>
   </section>
  </main>
  <script defer src="/public-cuaca.js"></script>
 </body>
</html>
