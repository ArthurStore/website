<!DOCTYPE html>
<html class="scroll-smooth" lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Public Upscale - Upload File</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-robot.svg"/>
  <link rel="shortcut icon" href="/favicon-robot.svg"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&amp;display=swap" rel="stylesheet"/>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      color: #dbeafe;
      background:
        radial-gradient(circle at 12% 16%, rgba(56, 189, 248, 0.24), transparent 36%),
        radial-gradient(circle at 88% 10%, rgba(99, 102, 241, 0.2), transparent 40%),
        linear-gradient(140deg, #020617 0%, #0b1733 48%, #102a5f 100%);
    }
    .glass {
      background: rgba(7, 16, 36, 0.72);
      border: 1px solid rgba(96, 165, 250, 0.28);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 36px rgba(2, 6, 23, 0.4);
    }
    .field:focus {
      outline: 2px solid rgba(147, 197, 253, 0.6);
      outline-offset: 1px;
    }
    .upload-input {
      width: 100%;
      border-radius: 12px;
      border: 1px dashed rgba(125, 211, 252, 0.45);
      background: rgba(8, 20, 43, 0.9);
      color: #e2e8f0;
      padding: 12px;
    }
    .upload-input::file-selector-button {
      border: 1px solid rgba(147, 197, 253, 0.42);
      background: rgba(30, 64, 175, 0.35);
      color: #dbeafe;
      border-radius: 9px;
      padding: 8px 12px;
      margin-right: 10px;
      cursor: pointer;
      font-weight: 700;
    }
    .btn-primary {
      border: 1px solid rgba(147, 197, 253, 0.3);
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 45%, #0ea5e9 100%);
      color: white;
      font-weight: 700;
      padding: 10px 14px;
      transition: transform .2s ease, filter .2s ease;
    }
    .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .result-box {
      margin-top: 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(2, 6, 23, 0.56);
      padding: 14px;
      white-space: pre-wrap;
      overflow-x: auto;
    }
    .preview {
      margin-top: 12px;
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid rgba(96, 165, 250, 0.32);
      background: rgba(2, 6, 23, 0.75);
    }
  </style>
</head>
<body>
  <main class="max-w-6xl mx-auto px-4 py-8 md:py-12 space-y-6">
    <section class="glass p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div>
          <p class="text-sm text-blue-200">⚡ Fitur Public / Upscale</p>
          <h1 class="text-3xl md:text-4xl font-extrabold text-blue-100">Tingkatkan Kualitas Foto Anda</h1>
          <p class="text-blue-200 mt-2">Unggah foto, lalu sistem otomatis memproses versi yang lebih tajam.</p>
        </div>
        <a href="/public" class="btn-primary inline-flex items-center gap-2 w-fit">
          <span>⬅️</span><span>Kembali</span>
        </a>
      </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <article class="glass p-5">
        <h2 class="text-2xl font-bold text-blue-200 mb-3">📤 Upload Gambar</h2>
        <form id="upscale-form" class="space-y-3">
          <input class="upload-input" id="image-file" name="image" type="file" accept="image/*" required/>
          <p id="upscale-file-info" class="text-xs text-blue-200">Belum ada file dipilih.</p>
          <button class="btn-primary w-full" type="submit">Proses Upscale 🚀</button>
        </form>
        <div id="upscale-result" class="result-box text-blue-100">Silakan pilih file gambar terlebih dahulu.</div>
      </article>

      <article class="glass p-5">
        <h2 class="text-2xl font-bold text-blue-200 mb-3">🖼️ Preview</h2>
        <p class="text-blue-200 text-sm">Kiri: gambar original. Kanan: hasil upscale.</p>
        <img id="origin-preview" class="preview hidden" alt="Preview original"/>
        <img id="result-preview" class="preview hidden" alt="Preview hasil upscale"/>
      </article>
    </section>
  </main>

  <script defer src="/public-upscale.js"></script>
</body>
</html>
