<html class="scroll-smooth" lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Brat generator · Video</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-robot.svg"/>
  <link rel="shortcut icon" href="/favicon-robot.svg"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      color: #e9d5ff;
      background:
        radial-gradient(circle at 16% 14%, rgba(167, 139, 250, 0.18), transparent 42%),
        radial-gradient(circle at 84% 18%, rgba(236, 72, 153, 0.14), transparent 44%),
        linear-gradient(145deg, #020617 0%, #1e1b4b 46%, #020617 100%);
    }
    h1, h2 { font-family: Outfit, "Plus Jakarta Sans", sans-serif; letter-spacing: -0.02em; }
    .glass {
      border-radius: 18px;
      border: 1px solid rgba(167, 139, 250, 0.3);
      background: rgba(15, 23, 42, 0.74);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 36px rgba(2, 6, 23, 0.44);
    }
    .btn {
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
      border: 1px solid rgba(196, 181, 253, 0.42);
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 45%, #db2777 100%);
      color: #fff;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .field {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(167, 139, 250, 0.35);
      background: rgba(2, 6, 23, 0.7);
      color: #e2e8f0;
      padding: 12px 14px;
      outline: none;
    }
    .field:focus { box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.35); }
    .status-strip {
      border: 1px solid rgba(196, 181, 253, 0.25);
      background: rgba(2, 6, 23, 0.55);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      color: #ede9fe;
    }
    video {
      width: 100%;
      max-height: 560px;
      border-radius: 14px;
      border: 1px solid rgba(196, 181, 253, 0.28);
      background: rgba(2, 6, 23, 0.75);
    }
    .btn-dl {
      margin-top: 10px;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      border: 1px solid rgba(196, 181, 253, 0.45);
      background: rgba(15, 23, 42, 0.65);
      color: #e2e8f0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-dl.hidden { display: none; }
  </style>
 </head>
 <body>
  <main class="max-w-5xl mx-auto px-4 py-8 md:py-12 space-y-6">
    <section class="glass p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-violet-200">Brat video generator</h1>
          <p class="text-violet-100/90 mt-2 text-sm leading-relaxed">Masukkan teks, lalu sistem akan menghasilkan video “brat” (mp4) untuk diunduh.</p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <a class="btn" href="/public"><i class="fas fa-th-large"></i>Hub</a>
          <a class="btn" href="/"><i class="fas fa-home"></i>Beranda</a>
        </div>
      </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
      <article class="glass p-6 space-y-3">
        <h2 class="text-xl font-bold text-violet-200">Input</h2>
        <input id="bratvid-text" class="field" placeholder="Contoh: Arthur Bot — made by Arthur" maxlength="120"/>
        <button id="bratvid-generate" type="button" class="btn w-full"><i class="fas fa-film"></i>Generate video</button>
        <div id="bratvid-status" class="status-strip">Tulis teks lalu generate.</div>
      </article>

      <article class="glass p-6 space-y-3">
        <h2 class="text-xl font-bold text-violet-200">Preview</h2>
        <video id="bratvid-preview" class="hidden" controls playsinline></video>
        <a id="bratvid-download" class="btn-dl hidden" href="#" download rel="noopener"><i class="fas fa-download"></i>Download mp4</a>
      </article>
    </section>
  </main>

  <script defer src="/public-bratvid.js"></script>
 </body>
</html>
