 <head>

  <title>Emoji Mix · Blend dua emoji jadi sticker</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-robot.svg"/>
  <link rel="shortcut icon" href="/favicon-robot.svg"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    body {
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      color: #dbeafe;
      cursor: default;
      background:
        radial-gradient(ellipse at left center, rgba(30, 90, 200, 0.22), transparent 58%),
        radial-gradient(circle at 84% 16%, rgba(250, 204, 21, 0.14), transparent 42%),
        linear-gradient(145deg, #020617 0%, #0b1733 50%, #06152e 100%);
    }
    a, button { cursor: pointer; }
    h1, h2 { font-family: Outfit, "Plus Jakarta Sans", sans-serif; letter-spacing: -0.02em; }
    .glass {
      border-radius: 18px;
      border: 1px solid rgba(96, 165, 250, 0.3);
      background: rgba(15, 23, 42, 0.74);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 36px rgba(2, 6, 23, 0.44);
    }
    .btn {
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
      border: 1px solid rgba(125, 211, 252, 0.45);
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 45%, #0ea5e9 100%);
      color: #fff;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .field {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(96, 165, 250, 0.35);
      background: rgba(2, 6, 23, 0.7);
      color: #e2e8f0;
      padding: 12px 14px;
      outline: none;
      font-size: 1.65rem;
      text-align: center;
      letter-spacing: 0.08em;
    }
    .field:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35); }
    .preview {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 14px;
      border: 1px solid rgba(96, 165, 250, 0.32);
      background: rgba(2, 6, 23, 0.75);
    }
    .status-strip {
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(2, 6, 23, 0.52);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      color: #e2e8f0;
    }
    .btn-dl {
      margin-top: 10px;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      border: 1px solid rgba(125, 211, 252, 0.45);
      background: rgba(15, 23, 42, 0.65);
      color: #e2e8f0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-dl:hover { border-color: rgba(147, 197, 253, 0.7); color: #fff; }
    .btn-dl.hidden, .preview.hidden { display: none; }
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 6px;
    }
    .emoji-chip {
      border-radius: 10px;
      border: 1px solid rgba(96, 165, 250, 0.28);
      background: rgba(2, 6, 23, 0.55);
      font-size: 1.25rem;
      line-height: 1.6;
      cursor: pointer;
    }
    .emoji-chip:hover, .emoji-chip.is-active {
      border-color: rgba(125, 211, 252, 0.7);
      background: rgba(37, 99, 235, 0.28);
    }
    @media (max-width: 640px) {
      .emoji-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }
  </style>
 </head>
 <body>
  <main class="max-w-5xl mx-auto px-4 py-8 md:py-12 space-y-6">
    <section class="glass p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-blue-100">Emoji Mix</h1>
          <p class="text-blue-200/90 mt-2 text-sm leading-relaxed">
            Blend dua emoji jadi satu visual. Pick, mix, download — siap pakai buat sticker &amp; chat.
          </p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <a class="btn" href="/public"><i class="fas fa-th-large"></i>Hub</a>
          <a class="btn" href="/"><i class="fas fa-home"></i>Beranda</a>
        </div>
      </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
      <article class="glass p-6 space-y-4">
        <h2 class="text-xl font-bold text-blue-200">Pilih emoji</h2>
        <div class="grid grid-cols-2 gap-3">
          <label class="block">
            <span class="text-xs uppercase tracking-wider text-sky-300/80 font-bold">Emoji 1</span>
            <input id="mix-emoji-1" class="field mt-1" type="text" inputmode="text" maxlength="8" placeholder="😀" autocomplete="off"/>
          </label>
          <label class="block">
            <span class="text-xs uppercase tracking-wider text-sky-300/80 font-bold">Emoji 2</span>
            <input id="mix-emoji-2" class="field mt-1" type="text" inputmode="text" maxlength="8" placeholder="🔥" autocomplete="off"/>
          </label>
        </div>
        <p class="text-xs text-blue-200/70">Tap chip di bawah, atau ketik langsung dari emoji keyboard.</p>
        <div id="emoji-picker" class="emoji-grid" aria-label="Emoji picker"></div>
        <button id="mix-generate" type="button" class="btn w-full"><i class="fas fa-blender"></i>Mix Emoji</button>
        <div id="mix-status" class="status-strip">Pilih dua emoji, lalu mix.</div>
      </article>

      <article class="glass p-6 space-y-3">
        <h2 class="text-xl font-bold text-blue-200">Preview</h2>
        <img id="mix-preview" class="preview hidden" alt="Hasil emoji mix"/>
        <a id="mix-download" class="btn-dl hidden" href="#" download rel="noopener"><i class="fas fa-download"></i>Download</a>
      </article>
    </section>
  </main>

  <script defer src="/public-emojimix.js"></script>
 </body>
</html>
