  <title>Instagram Downloader · Story / Reel / Post</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-robot.svg"/>
  <link rel="shortcut icon" href="/favicon-robot.svg"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      color: #dbeafe;
      background:
        radial-gradient(circle at 16% 14%, rgba(251, 113, 133, 0.18), transparent 42%),
        radial-gradient(circle at 84% 18%, rgba(167, 139, 250, 0.18), transparent 44%),
        linear-gradient(145deg, #020617 0%, #1e1b4b 50%, #020617 100%);
    }
    h1, h2 { font-family: Outfit, "Plus Jakarta Sans", sans-serif; letter-spacing: -0.02em; }
    .glass {
      border-radius: 18px;
      border: 1px solid rgba(196, 181, 253, 0.26);
      background: rgba(15, 23, 42, 0.74);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 36px rgba(2, 6, 23, 0.44);
    }
    .btn {
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
      border: 1px solid rgba(196, 181, 253, 0.42);
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 45%, #db2777 100%);
      color: #fff;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .field {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(196, 181, 253, 0.3);
      background: rgba(2, 6, 23, 0.7);
      color: #e2e8f0;
      padding: 12px 14px;
      outline: none;
    }
    .field:focus { box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.35); }
    .status-strip {
      border: 1px solid rgba(196, 181, 253, 0.22);
      background: rgba(2, 6, 23, 0.52);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      color: #ede9fe;
    }
    .media {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(196, 181, 253, 0.22);
      background: rgba(2, 6, 23, 0.72);
    }
    .btn-dl {
      margin-top: 10px;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      border: 1px solid rgba(196, 181, 253, 0.45);
      background: rgba(15, 23, 42, 0.65);
      color: #e2e8f0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .nav-btn {
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 900;
      border: 1px solid rgba(196, 181, 253, 0.35);
      background: rgba(2, 6, 23, 0.55);
      color: #e2e8f0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .nav-btn:disabled { opacity: 0.5; cursor: default; }
  </style>
 </head>
 <body>
  <main class="max-w-6xl mx-auto px-4 py-8 md:py-12 space-y-6">
    <section class="glass p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-violet-100">Instagram downloader</h1>
          <p class="text-violet-100/90 mt-2 text-sm leading-relaxed">
            Tempel link Story / Reel / Post. Nanti muncul list media + tombol download langsung.
          </p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <a class="btn" href="/public"><i class="fas fa-th-large"></i>Hub</a>
          <a class="btn" href="/"><i class="fas fa-home"></i>Beranda</a>
        </div>
      </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
      <article class="glass p-6 space-y-3">
        <h2 class="text-xl font-bold text-violet-200">Input</h2>
        <input id="ig-url" class="field" placeholder="https://www.instagram.com/reel/..." />
        <button id="ig-fetch" type="button" class="btn w-full"><i class="fas fa-download"></i>Ambil media</button>
        <div id="ig-status" class="status-strip">Masukkan link Instagram lalu klik ambil.</div>
      </article>

      <article class="glass p-6 space-y-3">
        <h2 class="text-xl font-bold text-violet-200">Hasil</h2>
        <div id="ig-nav" class="hidden flex items-center justify-between gap-3 border border-violet-300/15 rounded-2xl p-3 bg-slate-950/35">
          <button id="ig-prev" type="button" class="nav-btn"><i class="fas fa-chevron-left"></i>Prev</button>
          <div id="ig-counter" class="text-violet-100/90 text-sm font-extrabold"></div>
          <button id="ig-next" type="button" class="nav-btn">Next<i class="fas fa-chevron-right"></i></button>
        </div>
        <div id="ig-results" class="space-y-4"></div>
      </article>
    </section>
  </main>

  <script defer src="/public-instagram.js"></script>
 </body>
</html>
